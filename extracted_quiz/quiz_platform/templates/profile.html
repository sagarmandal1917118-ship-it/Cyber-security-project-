{% extends "base.html" %}{% block title %}My Profile{% endblock %}{% block content %}<h3 class="page-title">My Profile</h3><div class="cq-card p-4" style="max-width:650px"><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" value="{{ user.name }}" required maxlength="100"><label class="form-label">Email address</label><input class="form-control mb-3" value="{{ user.email }}" disabled><button class="btn btn-primary">Save profile</button></form><hr><p><b>Member since:</b> {{ user.created_at|dt }}</p><p><b>Quizzes attempted:</b> {{ stats.attempts }}</p><p><b>Best score:</b> {{ stats.best }}%</p></div>{% endblock %}
